// Bounded stateful pressure block for TIFFYCbCr conversion chains.
// This nudges mutators to emit valid init -> convert sequences.
message TIFFYCbCrChainBlock {
  optional uint32 repeat_count = 1;
  optional uint32 y = 2;
  optional int32 cb = 3;
  optional int32 cr = 4;
}

// Top-level fuzz input (v2). Dynamic sequence of Actions.
message FuzzInput {
  optional uint32 global_seed = 1;
  repeated Action actions = 2;
  optional uint32 max_actions_hint = 3;
  optional bool favor_valid_state = 4;
  repeated TIFFYCbCrChainBlock tiffy_cb_cr_chain = 5;
}
