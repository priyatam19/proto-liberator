syntax = "proto2";

package demo_fuzzer;

import "nanopb.proto";

// Parameters for Foo
// param_0: %struct.bar*
//   ↳ Handle to %struct.bar* object
//   ↳ Nullable exploration knob
// param_1: i8*
//   ↳ Array with explicit length control
//   ↳ Nullable exploration knob
// 
// Contract violation knobs for semantic bug exploration
//   ↳ Skip double-delete protection
message Foo_Params {
  optional uint32 param_0_handle = 1;
  optional bool param_0_is_null = 2;
  optional bytes param_1 = 3 [(nanopb).max_size = 65536];
  optional uint32 param_1_length = 4;
  optional uint32 param_1_length_override = 5;
  optional bool param_1_is_null = 6;
  optional bool allow_double_delete = 7;
}

// Dynamic dispatch: exactly one API call variant per Action.
message Action {
  oneof action {
    Foo_Params foo = 1;
  }
}

// Top-level fuzz input (v2). Dynamic sequence of Actions.
message FuzzInput {
  optional uint32 global_seed = 1;
  repeated Action actions = 2 [(nanopb).max_count = 64];
}

